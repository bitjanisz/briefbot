spring:

  datasource:
    url: jdbc:h2:mem:briefbot;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    initialization-mode: never

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: false

  # Optional H2 console
  h2:
    console:
      enabled: true
      path: /h2-console
