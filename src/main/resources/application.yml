server:
  servlet:
    context-path: /api

spring:
  config:
    import: "optional:classpath:dev-credentials.yml"

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email

  datasource:
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mvc:
    problemdetails:
      enabled: true

  springdoc:
    api-docs:
      path: /api-docs/openapi.json

    swagger-ui:
      path: /swagger-ui.html

    info:
      title: BriefBot API
      description: API documentation for the BriefBot application.
      version: v1.0.0

    group-configs:
      - group: default
        packages-to-scan:
          - com.admeliora.briefbot.user.api
          - com.admeliora.briefbot.auth.api