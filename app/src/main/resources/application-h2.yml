spring:

  datasource:
    url: jdbc:h2:file:./data/briefbot;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    initialization-mode: never

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  # H2 console is available on management port (8081) via /h2-console
  h2:
    console:
      enabled: true
      path: /h2-console
