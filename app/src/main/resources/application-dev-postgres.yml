spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/briefbot}
    username: ${SPRING_DATASOURCE_USERNAME:briefbot}
    password: ${SPRING_DATASOURCE_PASSWORD:briefbot}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/briefbot}
    user: ${SPRING_DATASOURCE_USERNAME:briefbot}
    password: ${SPRING_DATASOURCE_PASSWORD:briefbot}
    locations: classpath:db/migration
