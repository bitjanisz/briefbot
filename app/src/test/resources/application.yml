spring:

  mail:
    host: host
    port: 465
    username: username
    password: password
    properties:
      mail:
        from: kontakt@brifin.pl

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: xxxx
            client-secret: xxxx

  datasource:
    url: jdbc:h2:file:./data/briefbot;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    initialization-mode: never

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    enabled: true

  # Optional H2 console (embedded web console is started on a separate port by H2WebConsoleConfig)
  h2:
    console:
      enabled: true
      path: /h2-console

